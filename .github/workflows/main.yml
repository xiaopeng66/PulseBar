name: Release CI
on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:

jobs:

  x64_build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Install v143 MFC libraries
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
        $setup = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/setup.exe"
        $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $installPath) { throw 'Visual Studio C++ instance not found' }
        # v143 toolsets are 14.3x/14.4x; newer 14.5x directories belong to other toolsets.
        $toolset = Get-ChildItem "$installPath/VC/Tools/MSVC" -Directory |
          Where-Object { $_.Name -like '14.3*' -or $_.Name -like '14.4*' } |
          Sort-Object { [version]$_.Name } -Descending |
          Select-Object -First 1
        if (-not $toolset) { throw 'No v143 MSVC toolset found on the runner' }
        $components = @("Microsoft.VisualStudio.Component.VC.$($toolset.Name).MFC.x86.x64")
        Write-Host "Installing MFC for $($toolset.Name): $($components -join ', ')"
        # Start-Process splits array arguments on spaces; quote the install path explicitly.
        $argumentString = 'modify --installPath "' + $installPath + '" --quiet --norestart --noresume'
        foreach ($component in $components) { $argumentString += ' --add ' + $component }
        $process = Start-Process -FilePath $setup -ArgumentList $argumentString -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw "VS installer failed with exit code $($process.ExitCode)" }


      
    - name: Run msbuild
      run: msbuild PulseBar_Lite.sln -p:configuration="Release (lite)" -p:platform=x64 -p:platformToolset=v143

    - name: Verify release executable
      shell: pwsh
      run: |
        if (-not (Test-Path -LiteralPath 'Bin/x64/Release (lite)/PulseBar.exe' -PathType Leaf)) {
          throw 'Expected release executable was not produced: Bin/x64/Release (lite)/PulseBar.exe'
        }

    - name: Stage release languages
      shell: pwsh
      run: |
        python -X utf8 -I -B tools/stage-languages.py --build-output 'Bin/x64/Release (lite)'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"
      
    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_PulseBar
        if-no-files-found: error
        path: |
          Bin/x64/Release (lite)/PulseBar.exe
          Bin/x64/Release (lite)/*.dll
          Bin/x64/Release (lite)/language/*.ini

    - name : Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/x64/Release (lite)/*.pdb

