name: Release CI
on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:

jobs:

  x64_build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      
    - name: Run msbuild
      run: msbuild PulseBar_Lite.sln -p:configuration="Release (lite)" -p:platform=x64 -p:platformToolset=v143

    - name: Verify release executable
      shell: pwsh
      run: |
        if (-not (Test-Path -LiteralPath 'Bin/x64/Release (lite)/PulseBar.exe' -PathType Leaf)) {
          throw 'Expected release executable was not produced: Bin/x64/Release (lite)/PulseBar.exe'
        }

    - name: Stage release languages
      shell: pwsh
      run: |
        python -X utf8 -I -B tools/stage-languages.py --build-output 'Bin/x64/Release (lite)'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"
      
    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_PulseBar
        if-no-files-found: error
        path: |
          Bin/x64/Release (lite)/PulseBar.exe
          Bin/x64/Release (lite)/*.dll
          Bin/x64/Release (lite)/language/*.ini

    - name : Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/x64/Release (lite)/*.pdb

  x86_build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      
    - name: Run msbuild
      run: msbuild PulseBar_Lite.sln -p:configuration="Release (lite)" -p:platform=x86 -p:platformToolset=v143

    - name: Verify release executable
      shell: pwsh
      run: |
        if (-not (Test-Path -LiteralPath 'Bin/Release (lite)/PulseBar.exe' -PathType Leaf)) {
          throw 'Expected release executable was not produced: Bin/Release (lite)/PulseBar.exe'
        }

    - name: Stage release languages
      shell: pwsh
      run: |
        python -X utf8 -I -B tools/stage-languages.py --build-output 'Bin/Release (lite)'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"
      
    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x86_${{ steps.current-time.outputs.formattedTime }}_PulseBar
        if-no-files-found: error
        path: |
          Bin/Release (lite)/PulseBar.exe
          Bin/Release (lite)/*.dll
          Bin/Release (lite)/language/*.ini
      
    - name : Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: x86_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/Release (lite)/*.pdb

  arm64ec_build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      
    - name: Run msbuild
      run: msbuild PulseBar_Lite.sln -p:configuration="Release (lite)" -p:platform=ARM64EC -p:platformToolset=v143

    - name: Verify release executable
      shell: pwsh
      run: |
        if (-not (Test-Path -LiteralPath 'Bin/ARM64EC/Release (lite)/PulseBar.exe' -PathType Leaf)) {
          throw 'Expected release executable was not produced: Bin/ARM64EC/Release (lite)/PulseBar.exe'
        }

    - name: Stage release languages
      shell: pwsh
      run: |
        python -X utf8 -I -B tools/stage-languages.py --build-output 'Bin/ARM64EC/Release (lite)'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"

    # - name: Move dll file path 
    #   run: mv Bin/x64/Release/*.dll  Bin/ARM64EC/Release/

    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: arm64EC_${{ steps.current-time.outputs.formattedTime }}_PulseBar
        if-no-files-found: error
        path: |
          Bin/ARM64EC/Release (lite)/PulseBar.exe
          Bin/ARM64EC/Release (lite)/*.dll
          Bin/ARM64EC/Release (lite)/language/*.ini

    - name : Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: arm64EC_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/ARM64EC/Release (lite)/*.pdb
